name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny,cargo-audit,cargo-machete
      # Pinned to the version in the justfile so `codegen-check` runs the same generator.
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: openapi-to-rust@0.15.0
      - run: just ci

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    machete:
      glob: "Cargo.toml"
      run: cargo machete

pre-push:
  commands:
    ci:
      run: just ci

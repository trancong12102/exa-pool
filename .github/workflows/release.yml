name: release

# Conventional-commit driven. On every push to main, release-please keeps a
# "chore(main): release X.Y.Z" PR up to date (Cargo.toml, Cargo.lock,
# CHANGELOG.md). Merging that PR creates the tag and the GitHub release, and
# the same run then builds and attaches one archive (plus sha256) per target.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exa-pool
          target: ${{ matrix.target }}
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          locked: true
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Bump Formula/exa-pool.rb in trancong12102/homebrew-tap. Needs a PAT with
  # write access to the tap in the HOMEBREW_TAP_TOKEN secret; skipped otherwise.
  homebrew:
    needs: [release-please, upload]
    # always(): a failed Windows build must not block the formula, which only
    # needs the four macOS/Linux archives; the render script fails loudly if
    # any of those is missing.
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; Formula/exa-pool.rb was not updated for $TAG"
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: trancong12102/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          sh scripts/brew-formula.sh "$TAG" > tap/Formula/exa-pool.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/exa-pool.rb
          git commit -m "exa-pool ${TAG#v}"
          git push
